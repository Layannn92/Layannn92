<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pourquoi tu perds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@600;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1d5fe0; --navy:#0b1638; --orange:#f28c1c; --gold:#ffcf33;
    --red:#e8322b; --ink:#111; --paper:#fff8ec;
    --goku:#ff9a1f; --vegeta:#3d7bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;flex:none;width:1080px;height:1920px;overflow:hidden;background:var(--navy);transform-origin:center center}

  /* ---------- scenes ---------- */
  .scene{position:absolute;inset:0;display:none}
  .scene.active{display:block}
  .scene svg.art{position:absolute;left:0;top:0;width:1080px;height:1920px}

  .title{position:absolute;left:0;right:0;top:150px;text-align:center;z-index:5;
    font-family:Bangers,Impact,sans-serif;font-size:132px;letter-spacing:4px;line-height:.95;color:#fff;
    -webkit-text-stroke:6px #111;paint-order:stroke fill;text-shadow:10px 10px 0 #111;
    animation:titleIn .55s cubic-bezier(.2,1.6,.4,1) both}
  .title span{display:inline-block;padding:0 40px}
  @keyframes titleIn{from{transform:translateY(-80px) scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}

  /* subtitle bubble */
  #sub{position:absolute;left:60px;right:60px;bottom:150px;z-index:20;display:none}
  #sub.show{display:block;animation:subIn .3s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes subIn{from{transform:translateY(60px) scale(.9);opacity:0}to{transform:none;opacity:1}}
  #sub .name{display:inline-block;font-family:Bangers,Impact,sans-serif;font-size:64px;letter-spacing:3px;
    padding:6px 30px 0;border:6px solid #111;border-bottom:none;border-radius:22px 22px 0 0;color:#fff;-webkit-text-stroke:2px #111}
  #sub .box{background:#fff;border:6px solid #111;border-radius:0 30px 30px 30px;padding:34px 40px;
    font-weight:800;font-size:58px;line-height:1.18;color:#111;box-shadow:12px 12px 0 #111}
  #sub.goku .name{background:var(--goku)} #sub.vegeta .name{background:var(--vegeta)}
  #sub .box .w{opacity:0;transition:opacity .12s}
  #sub .box .w.on{opacity:1}

  /* progress */
  #prog{position:absolute;left:0;bottom:0;height:14px;background:var(--gold);z-index:30;width:0}

  /* ---------- reusable animations ---------- */
  .fb{transform-box:fill-box;transform-origin:center}
  .fbb{transform-box:fill-box;transform-origin:50% 100%}
  .pop{animation:pop .5s cubic-bezier(.2,1.8,.4,1) both}
  @keyframes pop{from{transform:scale(0) rotate(-12deg)}to{transform:none}}
  .d1{animation-delay:.3s!important}.d2{animation-delay:.6s!important}.d3{animation-delay:.9s!important}
  .d4{animation-delay:1.2s!important}.d5{animation-delay:1.6s!important}.d6{animation-delay:2s!important}
  .slideUp{animation:slideUp .7s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes slideUp{from{transform:translateY(500px)}to{transform:none}}
  .slideL{animation:slideL .7s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes slideL{from{transform:translateX(-900px)}to{transform:none}}
  .slideR{animation:slideR .7s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes slideR{from{transform:translateX(900px)}to{transform:none}}
  .zoomIn{animation:zoomIn 4s ease-out both}
  @keyframes zoomIn{from{transform:scale(.85)}to{transform:scale(1.08)}}
  .bob{animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-14px)}}
  .shake{animation:shake .12s linear infinite}
  @keyframes shake{25%{transform:translate(-6px,3px) rotate(-2deg)}75%{transform:translate(6px,-3px) rotate(2deg)}}
  .bigshake{animation:bigshake .1s linear infinite}
  @keyframes bigshake{25%{transform:translate(-18px,8px)}50%{transform:translate(12px,-10px)}75%{transform:translate(16px,10px)}}
  .flicker{animation:flicker .18s steps(2) infinite}
  @keyframes flicker{50%{opacity:.35;transform:scale(1.04,.97)}}
  .spin{animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .blinkRed{animation:blinkRed .5s steps(1) infinite}
  @keyframes blinkRed{50%{fill:#5a0000}}
  .bgRed{animation:bgRed .5s steps(1) infinite}
  @keyframes bgRed{0%{fill:#c4161c}50%{fill:#3a0306}}
  .loading{animation:loading 3.2s ease-in-out .4s both}
  @keyframes loading{from{transform:scaleX(0)}70%{transform:scaleX(.82)}to{transform:scaleX(1)}}
  .xp{animation:xp 2.4s cubic-bezier(.3,0,.2,1) 1.2s both;transform-box:fill-box;transform-origin:0 50%}
  @keyframes xp{from{transform:scaleX(.08)}to{transform:scaleX(1)}}
  .tilt{animation:tilt 1.4s cubic-bezier(.3,1.6,.5,1) .6s both}
  @keyframes tilt{from{transform:rotate(0)}to{transform:rotate(-17deg)}}
  .drop{animation:drop .6s cubic-bezier(.5,0,.8,.4) .5s both}
  @keyframes drop{from{transform:translateY(-900px)}80%{transform:translateY(20px)}to{transform:none}}
  .cape{animation:cape 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
  @keyframes cape{50%{transform:skewX(-14deg) scaleX(1.12)}}
  .drift{animation:drift 12s linear infinite}
  @keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
  .burst{animation:burst 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes burst{from{transform:scale(.1);opacity:1}to{transform:scale(2.6);opacity:0}}
  .rise{animation:rise 1.4s cubic-bezier(.3,1.3,.5,1) .5s both;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes rise{from{transform:rotate(-88deg) translateY(40px)}55%{transform:rotate(-30deg)}to{transform:none}}
  .float{animation:float 2s ease-out infinite}
  @keyframes float{from{transform:translateY(0);opacity:0}20%{opacity:1}to{transform:translateY(-260px);opacity:0}}
  .meat{animation:meat 1.6s cubic-bezier(.4,0,.4,1) .9s both}
  @keyframes meat{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(230px,-260px) rotate(300deg)}100%{transform:translate(470px,30px) rotate(600deg)}}
  .lunge{animation:lunge .7s cubic-bezier(.2,1.5,.4,1) .5s both}
  @keyframes lunge{from{transform:translateX(600px)}to{transform:none}}
  .dots circle{opacity:0;animation:dot .4s ease forwards}
  .dots circle:nth-child(1){animation-delay:.5s}.dots circle:nth-child(2){animation-delay:.9s}.dots circle:nth-child(3){animation-delay:1.3s}
  @keyframes dot{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .blink .lids{animation:lids 1.4s steps(1) infinite}
  @keyframes lids{0%,40%,55%,100%{opacity:0}45%,50%{opacity:1}}
  .beam{animation:beam 1s linear infinite;transform-origin:540px 560px}
  @keyframes beam{to{transform:rotate(360deg)}}
  .glow{animation:glow 1.2s ease-in-out infinite}
  @keyframes glow{50%{opacity:.5}}
  .sil *{fill:#000!important;stroke:#000!important}

  /* ---------- UI ---------- */
  #start{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    background:radial-gradient(circle at 50% 40%,#2a62ff,#081030 70%);color:#fff;text-align:center;padding:24px}
  #start h1{font-family:Bangers,Impact,sans-serif;font-size:clamp(48px,10vw,110px);letter-spacing:4px;-webkit-text-stroke:3px #111;text-shadow:6px 6px 0 #111}
  #start p{max-width:560px;opacity:.85;font-weight:600;line-height:1.5}
  #start button,#bar button{font-family:Bangers,Impact,sans-serif;letter-spacing:2px;font-size:34px;border:4px solid #111;border-radius:16px;
    background:var(--gold);color:#111;padding:12px 44px;cursor:pointer;box-shadow:6px 6px 0 #111}
  #start button:active{transform:translate(3px,3px);box-shadow:3px 3px 0 #111}
  #start label{font-weight:600;opacity:.85;display:flex;gap:10px;align-items:center}
  #bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;display:flex;gap:8px;opacity:.2;transition:opacity .2s}
  #bar:hover{opacity:1}
  #bar button{font-size:22px;padding:6px 18px;box-shadow:3px 3px 0 #111}
  #bar span{color:#fff;font-weight:800;align-self:center;min-width:70px;text-align:center}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="scenes"></div>
  <div id="sub"><div class="name"></div><div class="box"></div></div>
  <div id="prog"></div>
</div></div>

<div id="start">
  <h1>POURQUOI TU PERDS ?</h1>
  <p>Motion design « version Dragon Ball » — 17 scènes, voix des personnages.<br>
     Si des fichiers <code>voices/sceneXX.mp3</code> existent, ils sont utilisés ; sinon la synthèse vocale du navigateur double les persos.</p>
  <label><input type="checkbox" id="optTts" checked> Voix synthétiques (si pas de mp3)</label>
  <button id="go">▶ LANCER</button>
</div>

<div id="bar">
  <button id="prev">◀</button><button id="pause">❚❚</button><button id="next">▶</button><span id="count">1/17</span>
</div>

<script>
/* =====================================================================
   PERSONNAGES (SVG dessinés à la main, style chibi)
   origine = centre de la tête, tête ~ rx 85 / ry 100
   ===================================================================== */
const SKIN = '#f8c99c', SKIN_D = '#e2a674', HAIR = '#141414';

function eyes(expr, who){
  const brow = who === 'vegeta';
  switch(expr){
    case 'happy':  // ^^
      return `<path d="M-52 0 Q-34 -22 -16 0 M16 0 Q34 -22 52 0" stroke="#111" stroke-width="9" fill="none" stroke-linecap="round"/>`;
    case 'closed':
      return `<path d="M-52 -2 Q-34 10 -16 -2 M16 -2 Q34 10 52 -2" stroke="#111" stroke-width="8" fill="none" stroke-linecap="round"/>`;
    case 'angry': case 'furious': case 'smug':
      return `
        <path d="M-60 -38 L-12 -14 M60 -38 L12 -14" stroke="#111" stroke-width="${expr==='furious'?16:13}" stroke-linecap="round"/>
        <path d="M-52 -10 L-16 2 L-22 14 L-50 8 Z M52 -10 L16 2 L22 14 L50 8 Z" fill="#fff" stroke="#111" stroke-width="4"/>
        <circle cx="-30" cy="6" r="${expr==='furious'?3:5}" fill="#111"/><circle cx="30" cy="6" r="${expr==='furious'?3:5}" fill="#111"/>`;
    default:   // normal (gros yeux brillants)
      return `
        ${brow?'':'<path d="M-56 -36 Q-34 -46 -14 -36 M14 -36 Q34 -46 56 -36" stroke="#111" stroke-width="7" fill="none" stroke-linecap="round"/>'}
        <ellipse cx="-34" cy="-4" rx="15" ry="20" fill="#111"/><ellipse cx="34" cy="-4" rx="15" ry="20" fill="#111"/>
        <circle cx="-29" cy="-11" r="6" fill="#fff"/><circle cx="39" cy="-11" r="6" fill="#fff"/>`;
  }
}
function mouth(expr){
  switch(expr){
    case 'happy':   return `<path d="M-38 42 Q0 100 38 42 Z" fill="#7a1d1d" stroke="#111" stroke-width="6"/><path d="M-20 70 Q0 84 20 70" fill="#ff7a7a"/>`;
    case 'angry':   return `<path d="M-26 58 Q0 44 26 58" stroke="#111" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    case 'furious': return `<rect x="-36" y="44" width="72" height="28" rx="8" fill="#fff" stroke="#111" stroke-width="6"/><path d="M-18 44v28M0 44v28M18 44v28" stroke="#111" stroke-width="3"/>`;
    case 'smug':    return `<path d="M-24 56 Q10 62 30 44" stroke="#111" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    case 'closed':  return `<path d="M-22 52 Q0 66 22 52" stroke="#111" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    case 'flat':    return `<path d="M-18 56 H18" stroke="#111" stroke-width="7" stroke-linecap="round"/>`;
    default:        return `<path d="M-26 48 Q0 72 26 48" stroke="#111" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  }
}
function face(expr, who){
  return `
    <ellipse cx="-86" cy="10" rx="18" ry="26" fill="${SKIN}" stroke="#111" stroke-width="6"/>
    <ellipse cx="86" cy="10" rx="18" ry="26" fill="${SKIN}" stroke="#111" stroke-width="6"/>
    <ellipse cx="0" cy="0" rx="86" ry="100" fill="${SKIN}" stroke="#111" stroke-width="7"/>
    <path d="M-4 22 L4 34" stroke="${SKIN_D}" stroke-width="6" stroke-linecap="round"/>
    ${eyes(expr, who)}${mouth(expr)}`;
}

const GOKU_HAIR = `<path d="M-92 -6 L-176 -40 L-108 -78 L-190 -150 L-92 -128 L-128 -232 L-40 -150 L0 -250 L40 -150 L128 -232 L92 -128 L190 -150 L108 -78 L176 -40 L92 -6 L84 -52 L56 -38 L46 -84 L16 -40 L-6 -96 L-30 -40 L-56 -82 L-70 -36 L-86 -50 Z" fill="${HAIR}" stroke="#111" stroke-width="6" stroke-linejoin="round"/>`;
const VEG_HAIR  = `<path d="M-84 -20 L-104 -100 L-72 -96 L-96 -220 L-40 -160 L-30 -290 L0 -200 L30 -290 L40 -160 L96 -220 L72 -96 L104 -100 L84 -20 L60 -54 L30 -56 L0 -24 L-30 -56 L-60 -54 Z" fill="${HAIR}" stroke="#111" stroke-width="6" stroke-linejoin="round"/>`;

function gokuBody(pose){
  const armL = pose==='laugh' ? '' : `<rect x="-168" y="110" width="52" height="190" rx="26" fill="${SKIN}" stroke="#111" stroke-width="6"/><rect x="-170" y="270" width="56" height="34" rx="10" fill="#1f4fbf" stroke="#111" stroke-width="5"/>`;
  return `
    ${armL}
    <rect x="116" y="110" width="52" height="190" rx="26" fill="${SKIN}" stroke="#111" stroke-width="6"/>
    <rect x="114" y="270" width="56" height="34" rx="10" fill="#1f4fbf" stroke="#111" stroke-width="5"/>
    <path d="M-120 96 Q0 78 120 96 L134 360 L-134 360 Z" fill="var(--orange)" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-50 92 L0 182 L50 92 Z" fill="#1f4fbf" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="70" cy="170" r="26" fill="#fff" stroke="#111" stroke-width="5"/><text x="70" y="182" font-family="Bangers" font-size="34" text-anchor="middle" fill="#111">悟</text>
    <rect x="-138" y="330" width="276" height="40" rx="8" fill="#1f4fbf" stroke="#111" stroke-width="6"/>`;
}
function gokuLegs(){
  return `
    <path d="M-120 368 L-20 368 L-30 560 L-112 560 Z M20 368 L120 368 L112 560 L30 560 Z" fill="var(--orange)" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-120 550 L-24 550 L-20 620 L-140 620 Z M24 550 L120 550 L140 620 L20 620 Z" fill="#1f4fbf" stroke="#111" stroke-width="7" stroke-linejoin="round"/>`;
}
function vegBody(pose){
  const arms = pose==='cross'
    ? `<rect x="-150" y="190" width="300" height="62" rx="31" fill="#2350b8" stroke="#111" stroke-width="6"/>
       <ellipse cx="-118" cy="214" rx="40" ry="34" fill="#fff" stroke="#111" stroke-width="6"/>
       <ellipse cx="118" cy="228" rx="40" ry="34" fill="#fff" stroke="#111" stroke-width="6"/>`
    : `<rect x="-166" y="110" width="50" height="180" rx="25" fill="#2350b8" stroke="#111" stroke-width="6"/>
       <rect x="116" y="110" width="50" height="180" rx="25" fill="#2350b8" stroke="#111" stroke-width="6"/>
       <circle cx="-141" cy="294" r="32" fill="#fff" stroke="#111" stroke-width="6"/>
       <circle cx="141" cy="294" r="32" fill="#fff" stroke="#111" stroke-width="6"/>`;
  return `
    <path d="M-120 96 Q0 80 120 96 L130 370 L-130 370 Z" fill="#2350b8" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-110 100 Q0 140 110 100 L118 300 Q0 330 -118 300 Z" fill="#fdfdfd" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-150 96 Q-130 70 -96 88 L-104 132 Q-140 130 -150 96 Z M150 96 Q130 70 96 88 L104 132 Q140 130 150 96 Z" fill="var(--gold)" stroke="#111" stroke-width="6"/>
    <rect x="-130" y="330" width="260" height="40" rx="8" fill="#fff" stroke="#111" stroke-width="6"/>
    ${arms}`;
}

function goku({x=540,y=800,s=1,expr='normal',pose='',legs=false,glasses=false,cls=''}={}){
  const laughArm = pose==='laugh' ? `<path d="M-118 120 Q-210 40 -120 -40" stroke="#111" stroke-width="64" fill="none" stroke-linecap="round"/><path d="M-118 120 Q-210 40 -120 -40" stroke="${SKIN}" stroke-width="50" fill="none" stroke-linecap="round"/><circle cx="-112" cy="-48" r="36" fill="${SKIN}" stroke="#111" stroke-width="6"/>` : '';
  const g = glasses ? `<g fill="none" stroke="#111" stroke-width="7"><circle cx="-34" cy="-4" r="30" fill="rgba(255,255,255,.25)"/><circle cx="34" cy="-4" r="30" fill="rgba(255,255,255,.25)"/><path d="M-4 -6 H4 M-64 -10 L-86 -18 M64 -10 L86 -18"/></g>` : '';
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${cls}">
    ${legs?gokuLegs():''}${gokuBody(pose)}${laughArm}${face(expr,'goku')}${g}${GOKU_HAIR}
  </g></g>`;
}
function vegeta({x=540,y=800,s=1,expr='angry',pose='',vein=false,cls=''}={}){
  const v = vein ? `<path class="fb pop" d="M28 -70 l14 -14 m6 14 l14 -14 m-34 -6 l14 14 m6 -14 l14 14" stroke="var(--red)" stroke-width="9" stroke-linecap="round"/>` : '';
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${cls}">
    ${vegBody(pose)}${face(expr,'vegeta')}${v}${VEG_HAIR}
  </g></g>`;
}
function vegetaBack({x=540,y=800,s=1}={}){
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <path class="cape" d="M-140 100 L140 100 L210 560 Q0 600 -210 560 Z" fill="#2350b8" stroke="#111" stroke-width="7"/>
    <path d="M-140 100 Q0 70 140 100 L130 140 L-130 140 Z" fill="#fff" stroke="#111" stroke-width="6"/>
    <ellipse cx="0" cy="0" rx="86" ry="100" fill="${HAIR}" stroke="#111" stroke-width="6"/>
    ${VEG_HAIR}
    <path d="M-150 96 Q-130 70 -96 88 L-104 132 Q-140 130 -150 96 Z M150 96 Q130 70 96 88 L104 132 Q140 130 150 96 Z" fill="var(--gold)" stroke="#111" stroke-width="6"/>
  </g>`;
}

/* bulle BD */
function bubble(x,y,w,h,text,size=110,fill='#fff',cls='pop'){
  return `<g transform="translate(${x} ${y})"><g class="fb ${cls}">
    <path d="M${-w/2} ${-h/2} h${w} v${h} h${-w*0.55} l-70 90 l10 -90 h${-w*0.45+60} Z" fill="${fill}" stroke="#111" stroke-width="8" stroke-linejoin="round" transform="translate(0 0)"/>
    <text x="0" y="${size*0.36}" text-anchor="middle" font-family="Bangers" font-size="${size}" fill="#111" letter-spacing="3">${text}</text>
  </g></g>`;
}
/* lignes de vitesse en fond */
function speedLines(color='rgba(255,255,255,.18)', cx=540, cy=900){
  let s=''; for(let i=0;i<48;i++){const a=i/48*Math.PI*2, w=0.035;
    s+=`<path d="M${cx} ${cy} L${cx+Math.cos(a-w)*2200} ${cy+Math.sin(a-w)*2200} L${cx+Math.cos(a+w)*2200} ${cy+Math.sin(a+w)*2200} Z" fill="${color}"/>`;}
  return `<g class="fb spin" style="animation-duration:40s">${s}</g>`;
}
/* cerveau pixel art */
const BRAIN = [
 '.....######.....','...##########...','..############..','.##############.','.##############.',
 '################','################','.##############.','..############..','...###....###...',
 '.........##.....','.........##.....'];
function pixelBrain(x,y,px,col='#ff8fb3',dark='#d4507f',cls=''){
  let s='';
  BRAIN.forEach((row,r)=>[...row].forEach((c,k)=>{ if(c!=='#') return;
    const d = (r*7+k*3)%5===0 || (k===8 && r<9);
    s+=`<rect x="${k*px}" y="${r*px}" width="${px}" height="${px}" fill="${d?dark:col}" class="${cls}"/>`;}));
  return `<g transform="translate(${x-8*px} ${y-6*px})">${s}</g>`;
}
function sparkles(n,xmin,xmax,ymin,ymax,color='#fff'){
  let s=''; for(let i=0;i<n;i++){const x=xmin+((i*137)%100)/100*(xmax-xmin), y=ymin+((i*71)%100)/100*(ymax-ymin);
    s+=`<g transform="translate(${x} ${y})"><path class="fb pop" style="animation-delay:${(i%6)*.25+.4}s" d="M0 -30 L8 -8 L30 0 L8 8 L0 30 L-8 8 L-30 0 L-8 -8 Z" fill="${color}"/></g>`;}
  return s;
}

/* =====================================================================
   SCÈNES
   ===================================================================== */
const SCENES = [
 { title:'POURQUOI TU PERDS', who:'vegeta', line:'Pourquoi je déteste perdre ?', sfx:'pop',
   art:()=>`<rect width="1080" height="1920" fill="var(--blue)"/>${speedLines()}
     <g class="slideUp">${vegeta({y:1000,s:1.5,expr:'furious',cls:'sil'})}</g>
     ${bubble(720,560,460,200,'ENCORE ?!',120,'#fff','pop d2')}` },

 { title:'MÊME À UN JEU NUL', who:'goku', line:"Vegeta… c'était juste Mario Kart.",
   art:()=>`<rect width="1080" height="1920" fill="#f7d9a8"/>
     <rect y="1250" width="1080" height="670" fill="#b8763d"/><path d="M0 1250 H1080" stroke="#111" stroke-width="8"/>
     <rect x="300" y="420" width="480" height="300" rx="20" fill="#222" stroke="#111" stroke-width="10"/>

/* =====================================================================
   SFX (Web Audio, rien à télécharger)
   ===================================================================== */
let AC;
function ac(){ return AC || (AC = new (window.AudioContext||window.webkitAudioContext)()); }
function tone(f1,f2,dur,type='square',vol=.12,t0=0){
  const c=ac(), o=c.createOscillator(), g=c.createGain(), t=c.currentTime+t0;
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
function noise(dur,vol=.4,freq=800,t0=0){
  const c=ac(), b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(), t=c.currentTime+t0;
  s.buffer=b; f.type='lowpass'; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}
const SFX = {
  pop(){ tone(300,900,.15,'sine',.25,.6); },
  blip(){ tone(880,880,.08,'square',.08); tone(1320,1320,.08,'square',.08,.1); },
  rumble(){ noise(2.5,.35,180); },
  thud(){ noise(.5,.6,220,.9); tone(120,40,.4,'sine',.4,.9); },
  chalk(){ for(let i=0;i<4;i++) noise(.12,.12,3000,.3+i*.3); },
  roar(){ noise(1,.4,500,.5); tone(160,70,1,'sawtooth',.12,.5); },
  siren(){ for(let i=0;i<4;i++){ tone(600,1100,.5,'sawtooth',.07,i); tone(1100,600,.5,'sawtooth',.07,i+.5);} },
  boom(){ noise(1.8,.9,400); tone(90,30,1.5,'sine',.6); },
  laugh(){ [0,.18,.36].forEach(t=>tone(500,380,.14,'triangle',.12,t)); },
  shine(){ [0,.08,.16,.24].forEach((t,i)=>tone(1200+i*300,1600+i*300,.25,'sine',.08,t+.6)); },
  wind(){ noise(4,.12,600); },
  xp(){ for(let i=0;i<10;i++) tone(400+i*60,420+i*60,.07,'square',.05,1.2+i*.22); },
  levelup(){ [523,659,784,1047].forEach((f,i)=>tone(f,f,.22,'square',.1,1.4+i*.14)); tone(1047,1568,.6,'triangle',.12,2); },
};

/* =====================================================================
   VOIX : mp3 (voices/sceneXX.mp3) sinon synthèse vocale fr-FR
   ===================================================================== */
const VOICE = { goku:{pitch:1.55, rate:1.12}, vegeta:{pitch:.55, rate:.92} };
let frVoices = [];
function loadVoices(){ frVoices = speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang)); }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(who){
  if(!frVoices.length) return null;
  const male = frVoices.filter(v=>/(thomas|paul|henri|nicolas|male|homme|daniel|antoine|claude)/i.test(v.name));
  const pool = male.length ? male : frVoices;
  return who==='vegeta' ? pool[0] : (pool[1] || pool[0]);
}
function tryMp3(idx){
  return new Promise(res=>{
    const a = new Audio(`voices/scene${String(idx+1).padStart(2,'0')}.mp3`);
    let done=false; const fin=v=>{ if(!done){done=true;res(v);} };
    a.addEventListener('canplaythrough',()=>fin(a),{once:true});
    a.addEventListener('error',()=>fin(null),{once:true});
    setTimeout(()=>fin(null),1500); a.load();
  });
}
function speak(idx, sc, onWord){
  return new Promise(async res=>{
    const mp3 = await tryMp3(idx);
    if(mp3){ mp3.onended=()=>res(); mp3.play().catch(()=>res()); revealAll(); return; }
    if(!document.getElementById('optTts').checked || !('speechSynthesis' in window)){ revealTimed(sc.line); setTimeout(res, estimate(sc.line)); return; }
    const u = new SpeechSynthesisUtterance(sc.line);
    u.lang='fr-FR'; const v=pickVoice(sc.who); if(v) u.voice=v;
    Object.assign(u, VOICE[sc.who]||{});
    let fallback = setTimeout(()=>{revealAll();res();}, estimate(sc.line)+4000);
    u.onboundary = e=>{ if(e.name==='word'||e.charIndex!==undefined) onWord(e.charIndex); };
    u.onend = ()=>{ clearTimeout(fallback); revealAll(); res(); };
    u.onerror = ()=>{ clearTimeout(fallback); revealTimed(sc.line); setTimeout(res, estimate(sc.line)); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    revealTimed(sc.line, true);
  });
}
const estimate = t => 900 + t.split(/\s+/).length*380;

/* sous-titres mot à mot */
const subEl = document.getElementById('sub'), boxEl = subEl.querySelector('.box'), nameEl = subEl.querySelector('.name');
let wordSpans = [], timers = [];
function setSub(sc){
  timers.forEach(clearTimeout); timers=[];
  if(!sc.line){ subEl.className=''; return; }
  nameEl.textContent = sc.who==='goku' ? 'GOKU' : 'VEGETA';
  let pos=0; boxEl.innerHTML = sc.line.split(' ').map(w=>{const s=`<span class="w" data-i="${pos}">${w}</span>`; pos+=w.length+1; return s;}).join(' ');
  wordSpans=[...boxEl.querySelectorAll('.w')];
  subEl.className=''; void subEl.offsetWidth; subEl.className='show '+sc.who;
}
function onWord(ci){ wordSpans.forEach(s=>{ if(+s.dataset.i<=ci) s.classList.add('on'); }); }
function revealAll(){ wordSpans.forEach(s=>s.classList.add('on')); }
function revealTimed(line, soft){
  const step = estimate(line)/Math.max(wordSpans.length,1);
  wordSpans.forEach((s,i)=>timers.push(setTimeout(()=>s.classList.add('on'), i*step*(soft?1.05:1))));
}

/* =====================================================================
   LECTEUR
   ===================================================================== */
const scenesEl = document.getElementById('scenes');
scenesEl.innerHTML = SCENES.map((sc,i)=>`<section class="scene" id="s${i}">
  <svg class="art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">${sc.art()}</svg>
  ${sc.title?`<div class="title"><span>${sc.title}</span></div>`:''}</section>`).join('');

let cur=-1, paused=false, token=0;
const prog = document.getElementById('prog'), countEl=document.getElementById('count');
async function show(i){
  if(i<0||i>=SCENES.length){ return; }
  const my = ++token; cur=i;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('s'+i); void el.offsetWidth; el.classList.add('active');
  countEl.textContent=`${i+1}/${SCENES.length}`; prog.style.width = ((i+1)/SCENES.length*100)+'%';
  const sc=SCENES[i]; setSub(sc);
  try{ SFX[sc.sfx]?.(); }catch(e){}
  const minT = new Promise(r=>setTimeout(r, sc.duration || 2600));
  const talk = sc.line ? new Promise(r=>setTimeout(r,450)).then(()=>speak(i,sc,onWord)) : Promise.resolve();
  await Promise.all([minT, talk]);
  await new Promise(r=>setTimeout(r,550));
  while(paused && my===token) await new Promise(r=>setTimeout(r,200));
  if(my===token && i<SCENES.length-1) show(i+1);
}
document.getElementById('go').onclick=()=>{ ac().resume(); document.getElementById('start').remove(); show(0); };
document.getElementById('next').onclick=()=>show(Math.min(cur+1,SCENES.length-1));
document.getElementById('prev').onclick=()=>show(Math.max(cur-1,0));
document.getElementById('pause').onclick=e=>{ paused=!paused; e.target.textContent=paused?'▶':'❚❚';
  document.getElementById('stage').style.animationPlayState=paused?'paused':'running';
  document.querySelectorAll('#stage *').forEach(n=>n.style.animationPlayState=paused?'paused':''); };
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') document.getElementById('next').click();
  if(e.key==='ArrowLeft') document.getElementById('prev').click(); if(e.key===' ') document.getElementById('pause').click(); });

/* mise à l'échelle 9:16 */
function fit(){ const s=Math.min(innerWidth/1080, innerHeight/1920); document.getElementById('stage').style.transform=`scale(${s})`; }
addEventListener('resize',fit); fit();

/* ?scene=N pour ouvrir directement une scène (sans son) */
const q = new URLSearchParams(location.search).get('scene');
if(q){ document.getElementById('start').remove(); const n=+q-1; document.getElementById('s'+n)?.classList.add('active'); cur=n; setSub(SCENES[n]); revealAll(); }
</script>
